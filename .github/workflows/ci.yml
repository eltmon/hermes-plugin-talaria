name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest tests/ -q
      # Required once hermes-agent is installable in CI; allowed to fail until then.
      - name: hermes plugins doctor
        continue-on-error: true
        run: hermes plugins doctor . --ci
